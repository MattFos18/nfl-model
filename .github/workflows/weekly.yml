name: weekly run
on:
  schedule:
    - cron: "0 10 * * 2"    # Tuesday 06:00 ET (10:00 UTC; 11:00 UTC after the clocks change)
    - cron: "0 14 * * 6"    # Saturday 10:00 ET
  workflow_dispatch:
    inputs:
      full:
        description: "Re-pull every season since 2012"
        default: "false"
permissions:
  contents: write
concurrency:
  group: nfl-model-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: weekly pipeline
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then python -m nflmodel.weekly --full; else python -m nflmodel.weekly; fi
      - name: commit results
        run: |
          git config user.name "nfl-model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed data/raw/pull_log.csv data/weather data/tracker data/runs reports web/data
          git diff --cached --quiet || git commit -m "Weekly run $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push

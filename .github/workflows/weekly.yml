name: weekly run
on:
  schedule:
    - cron: "0 10 * * 2"    # Tuesday 06:00 ET (10:00 UTC; 11:00 UTC after the clocks change)
    - cron: "0 14 * * 6"    # Saturday 10:00 ET
    - cron: "0 18 * * 4"    # Thursday 14:00 ET: fresh kickoff forecast and lines for Thursday night
    - cron: "0 13 * * 0"    # Sunday 09:00 ET: final forecast and lines before the early games
  workflow_dispatch:
    inputs:
      full:
        description: "Re-pull every season since 2012"
        default: "false"
permissions:
  contents: write
  issues: write         # the site-health alert (nflmodel/health_alert.py)
concurrency:
  group: nfl-model-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # data/raw (play-by-play since 2012, ~300 MB) is not committed; keep it in the Actions cache between runs and
      # re-pull everything when the cache is missing (first run, or evicted after a week unused)
      - name: restore raw data
        id: raw
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-raw-v2
      - name: weekly pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ] || [ "${{ steps.raw.outputs.cache-hit }}" != "true" ]; then python -m nflmodel.weekly --full; else python -m nflmodel.weekly; fi
      - name: commit results
        run: |
          git config user.name "nfl-model bot"
          git config user.email "actions@users.noreply.github.com"
          for d in data/processed data/raw/pull_log.csv data/weather data/tracker data/runs data/lines reports web/data README.md; do if [ -e "$d" ]; then git add -A "$d"; fi; done
          if [ -e data/raw/injuries/espn_injuries.csv ]; then git add -f data/raw/injuries/espn_injuries.csv; fi
          git diff --cached --quiet || git commit -m "Weekly run $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main || (git rebase --abort || true; git pull --no-rebase -X ours origin main)
          for i in 1 2 3 4 5; do git push && break; [ "$i" = 5 ] && exit 1; echo "push failed (try $i), retrying"; sleep $((i * 15)); git pull --rebase -X theirs origin main || (git rebase --abort || true; git pull --no-rebase -X ours origin main); done   # GitHub answered a push with a 500 once and lost a run (24 Sep 2026)
      - name: health alert      # one GitHub issue labelled site-health, opened when a check fails, closed when all pass
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m nflmodel.health_alert

name: dev openers probe
on:
  push:
    branches: [claude/sharp-cray-vbvt7i]
    paths: [.github/workflows/dev-openers.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p data/raw/openers_probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -sSL -A "$UA" -o data/raw/openers_probe/index.html "https://www.sportsbookreviewsonline.com/scores-odds-archives/nfl/" || true
          curl -sSL -A "$UA" -o data/raw/openers_probe/index2.html "https://www.sportsbookreviewsonline.com/scoresoddsarchives/nfl/nfloddsarchives.htm" || true
          for s in "2015-16" "2023-24"; do curl -sSL -A "$UA" -o "data/raw/openers_probe/nfl_odds_$s.xlsx" "https://www.sportsbookreviewsonline.com/scoresoddsarchives/nfl/nfl%20odds%20$s.xlsx" || true; curl -sSL -A "$UA" -o "data/raw/openers_probe/nfl_odds_${s}_b.xlsx" "https://www.sportsbookreviewsonline.com/scores-odds-archives/nfl/nfl-odds-$s.xlsx" || true; done
          ls -la data/raw/openers_probe; for f in data/raw/openers_probe/*; do echo "== $f"; file "$f"; head -c 300 "$f" | tr -d '\0' | head -5; echo; done
          grep -oiE 'href="[^"]*\.(xlsx|xls|csv)"' data/raw/openers_probe/index.html | head -40 || true
      - name: commit
        run: |
          git config user.name "nfl-model bot"; git config user.email "actions@users.noreply.github.com"
          git add -f data/raw/openers_probe && (git commit -q -m "dev: openers probe" && git push) || echo "nothing"

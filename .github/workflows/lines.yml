name: line watch
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes: GitHub never started a */10 schedule on this repo; 30 is the cadence it honours
  push:
    branches: [kick]         # a Claude routine pushes an empty commit to `kick` every hour, since GitHub's cron has not fired on its own
  workflow_dispatch:
    inputs:
      force_odds:
        description: "Call The Odds API on this run regardless of the eight-hour cadence (to check the key)"
        default: "false"
      force_props:
        description: "Pull player prop lines on this run regardless of the twice-weekly cadence (about 96 credits)"
        default: "false"
      force_dfs:
        description: "Pull only the free pick'em lines (PrizePicks, Underdog) on this run"
        default: "false"
      force_futures:
        description: "Fetch the season-long markets (ESPN futures, Odds API outrights) on this run even if today's are in"
        default: "false"
permissions:
  contents: write
  actions: write        # to start the weekly run when the live check finds a model input changed
  issues: write         # the site-health alert (nflmodel/health_alert.py)
concurrency:
  group: nfl-model-lines   # its own queue (24 Sep 2026): GitHub keeps one pending run per group, so a shared group let a line watch cancel a queued weekly run; pushes retry and rebase instead
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: skip while a weekly run is going   # the weekly run pulls the lines itself and commits last
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow weekly.yml --status in_progress --json databaseId --jq length || echo 0)
          echo "weekly in progress: $n"; if [ "$n" != "0" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != '1'
        with:
          ref: main            # always run main's code and log to main, whichever event started the run
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != '1'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.skip != '1'
      - name: newest raw data copy   # by name from the cache list: the prefix restore kept returning the first weekly run's copy (27 Sep 2026)
        id: rawkey
        if: steps.gate.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key nflverse-raw-v2 --sort created_at --order desc --limit 5 --json key,ref,createdAt,sizeInBytes || true
          echo "key=$(gh cache list --key nflverse-raw-v2- --sort created_at --order desc --limit 1 --json key -q '.[0].key' || true)" >> "$GITHUB_OUTPUT"
      - name: restore raw data   # props --live re-projects from the play-by-play the weekly run keeps in the Actions cache (26 Sep 2026: without it the step failed); restore only, the weekly run saves it
        if: steps.gate.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: ${{ steps.rawkey.outputs.key || 'nflverse-raw-v2' }}
          restore-keys: nflverse-raw-v2
      - name: log lines
        if: steps.gate.outputs.skip != '1'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_EVERY_RUN: ${{ github.event.inputs.force_odds == 'true' && '1' || '' }}
          PROPS_EVERY_RUN: ${{ github.event.inputs.force_props == 'true' && '1' || '' }}
          DFS_EVERY_RUN: ${{ github.event.inputs.force_dfs == 'true' && '1' || '' }}
        run: python -m nflmodel.lines
      - name: season-long markets, once a day   # Super Bowl, conference, division, win totals, player season totals (nflmodel/futures.py)
        if: steps.gate.outputs.skip != '1'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FUTURES_EVERY_RUN: ${{ github.event.inputs.force_futures == 'true' && '1' || '' }}
        run: python -m nflmodel.futures --fetch
      - name: live check        # starters, injuries (league and ESPN) and kickoff forecasts: re-price when a model input changed (nflmodel/refresh.py)
        if: steps.gate.outputs.skip != '1'
        id: fresh
        run: python -m nflmodel.refresh --check
      - name: cards from the log   # Python prices the cards on the newest line snapshot (picks.table: consensus line, edges, chances, flags, stake, Vegas win), the props re-project on it with the newest forecast and book lines, and the books' season markets follow the futures pull; the page only displays these files
        if: steps.gate.outputs.skip != '1'
        run: |
          python -m nflmodel.results      # scores from the ESPN scoreboard, the model's pre-kickoff calls graded (web/data/live.js, 27 Sep 2026); the play-by-play of every game under way or final (web/data/plays.js, 28 Sep 2026)
          python -m nflmodel.props --live
          python -m nflmodel.export_web --week
      - name: health checks     # every tie check against the files just written; the page's health chip reads web/data/health.js
        if: steps.gate.outputs.skip != '1'
        continue-on-error: true
        run: python -m nflmodel.tie_check --page --source "line watch" > /dev/null
      - name: commit log
        if: steps.gate.outputs.skip != '1'
        run: |
          git config user.name "nfl-model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lines data/results web/data/week.js web/data/props.js web/data/season.js web/data/fresh.js web/data/health.js web/data/live.js web/data/plays.js data/processed/props.json data/weather data/runs/refresh_log.csv reports/props_*_wk*.csv reports/props_*_wk*.md
          if [ -e data/raw/injuries/espn_injuries.csv ]; then git add -f data/raw/injuries/espn_injuries.csv; fi
          git diff --cached --quiet || git commit -m "Lines $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -X theirs origin main || (git rebase --abort || true; git pull --no-rebase -X ours origin main)
          for i in 1 2 3 4 5; do git push && break; [ "$i" = 5 ] && exit 1; echo "push failed (try $i), retrying"; sleep $((i * 15)); git pull --rebase -X theirs origin main || (git rebase --abort || true; git pull --no-rebase -X ours origin main); done   # GitHub answered a push with a 500 once and lost a run (24 Sep 2026)
      - name: publish the page to GitHub Pages   # a push by the workflow token starts no other workflow, so pages.yml is dispatched here; skipped until Pages is enabled in the repository settings (28 Sep 2026)
        if: steps.gate.outputs.skip != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then gh workflow run pages.yml --ref main; else echo "Pages not enabled: Settings -> Pages -> Source: GitHub Actions"; fi
      - name: keep the heartbeat going   # the chain that kicks this workflow every 30 minutes (heartbeat.yml); restart it when none is queued or running
        if: steps.gate.outputs.skip != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          a=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow heartbeat.yml --status in_progress --json databaseId --jq length || echo 1)
          b=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow heartbeat.yml --status queued --json databaseId --jq length || echo 1)
          echo "heartbeat runs: $a in progress, $b queued"; if [ "$a" = "0" ] && [ "$b" = "0" ]; then gh workflow run heartbeat.yml --ref main; fi
      - name: Monday audit fallback   # GitHub's cron has never started health.yml on this repo (28 Sep 2026: two manual runs, no scheduled one); once each Monday after 13:00 UTC, dispatch it when nothing has run that day
        if: steps.gate.outputs.skip != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" -ge 13 ]; then
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow health.yml --created "$(date -u +%Y-%m-%d)" --json databaseId --jq length || echo 1)
            echo "audit runs today: $n"; if [ "$n" = "0" ]; then gh workflow run health.yml --ref main; fi
          fi
      - name: re-price when an input changed
        if: steps.gate.outputs.skip != '1' && (steps.fresh.outputs.reprice == '1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run weekly.yml --ref main
      - name: health alert      # one GitHub issue labelled site-health, opened when a check fails, closed when all pass
        if: always() && steps.gate.outputs.skip != '1'   # always: a crashed line watch raises the alert (24 Sep 2026); not on a skipped turn
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: python -m nflmodel.health_alert

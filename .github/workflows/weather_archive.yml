name: weather archive
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "season range, e.g. 2013-2025"
        default: "2013-2025"
permissions:
  contents: write
concurrency:
  group: nfl-model-archive   # its own group: a fetch can run for hours and must not block the line watch or the weekly run
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas pyarrow requests
      - name: kickoff-hour weather from the Open-Meteo archive
        run: python -m nflmodel.weather_archive --seasons "${{ github.event.inputs.seasons || '2013-2025' }}"
      - name: commit
        if: always()
        run: |
          git config user.name "nfl-model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weather/archive_kickoff.csv
          git diff --cached --quiet || git commit -m "Weather archive: kickoff-hour readings"
          git pull --rebase -X theirs origin main || (git rebase --abort || true; git pull --no-rebase -X ours origin main)
          for i in 1 2 3 4 5; do git push && break; [ "$i" = 5 ] && exit 1; echo "push failed (try $i), retrying"; sleep $((i * 15)); git pull --rebase -X theirs origin main || (git rebase --abort || true; git pull --no-rebase -X ours origin main); done   # GitHub answered a push with a 500 once and lost a run (24 Sep 2026)

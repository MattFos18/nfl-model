name: weekly audit
on:
  schedule:
    - cron: "0 13 * * 1"    # Monday 09:00 ET, after the Sunday run and the weekend's line watch
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: nfl-model-data
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: browser for the page walk
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: weekly audit
        id: audit
        run: |
          set +e
          python -m nflmodel.audit_weekly
          echo "result=$?" >> "$GITHUB_OUTPUT"
      - name: open, update or close the audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.audit.outputs.result }}
        run: |
          n=$(gh issue list --label health --state open --json number --jq '.[0].number')
          if [ "$RESULT" != "0" ]; then
            body="$(cat reports/weekly_audit.md; echo; echo; cat reports/health.md)"
            if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else
              gh label create health --color d73a4a --description "weekly audit" 2>/dev/null || true
              gh issue create --title "Weekly audit failing: $(date -u +%Y-%m-%d)" --label health --body "$body"
              n=$(gh issue list --label health --state open --json number --jq '.[0].number'); fi
            echo "" >> reports/weekly_audit.md; echo "Issue: https://github.com/${{ github.repository }}/issues/$n" >> reports/weekly_audit.md
          else
            if [ -n "$n" ]; then gh issue close "$n" --comment "Clean again on $(date -u +%Y-%m-%d): $(grep -m1 '^\*\*' reports/weekly_audit.md)"; fi
            echo "" >> reports/weekly_audit.md; echo "Issue: none open" >> reports/weekly_audit.md
          fi
          echo "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> reports/weekly_audit.md
      - name: commit reports
        run: |
          git config user.name "nfl-model bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/weekly_audit.md reports/health.md reports/tie_check.md reports/verification.md
          git diff --cached --quiet || git commit -m "Weekly audit $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main || (git rebase --abort || true; git pull --no-rebase -X ours origin main)
          git push
      - name: fail the run when the audit fails
        if: steps.audit.outputs.result != '0'
        run: exit 1

name: logos
# The 32 team logos for the page, from ESPN's image server at 64 px (nflmodel/logos.py). Run once, or when a team
# changes its logo; the files are committed to web/logos and published with the page.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nfl-model-data
  cancel-in-progress: false
jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m nflmodel.logos
      - name: commit logos
        run: |
          git config user.name "nfl-model bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/logos
          git diff --cached --quiet || git commit -m "Team logos"
          git pull --rebase -X theirs origin main || (git rebase --abort || true; git pull --no-rebase -X ours origin main)
          git push
